# build-script presets for host-swift, read after swift's own
# utils/build-presets.ini (swift.mk passes both with --preset-file).
#
# buildbot_linux,no_test as upstream has it, less the products build-script
# builds through its unified SwiftPM workspace
# (utils/build_swift/resources/SwiftPM-Unified-Build.xcworkspace), which
# names every sibling repository as "group:../../../../<repository>".
# build-script finds that file from its own resolved path, and here
# swift-source/swift is a symlink to the package directory, so the four
# levels climb out of swift-source/ instead of landing in it. SwiftPM then
# warns "ignoring non-package fileref .../build/swiftpm" for every entry and
# stops at "error: No root package was found" - after the compiler, the
# libraries and SwiftPM are all built and installed.
#
# None of these is used to build anything here: swift-format, the
# sourcekit-lsp language server and the indexstore-db it needs, and
# swift-docc. The toolchain the Buildroot packages build with is complete
# without them.
#
# The installable-package tests go too. They run swift-integration-tests
# against the packaged toolchain, and their lit.cfg stops at "fatal: docc
# does not exist!" without swift-docc. build-script-impl reads the option as
# a non-empty string, so it is switched off with an empty value: "0" would
# still run them.
[preset: swift_linux_host]
mixin-preset=buildbot_linux,no_test
swiftformat=0
install-swiftformat=0
indexstore-db=0
sourcekit-lsp=0
install-sourcekit-lsp=0
swiftdocc=0
install-swiftdocc=0
test-installable-package=
