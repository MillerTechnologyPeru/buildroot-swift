name: Docker
on: [workflow_dispatch]
jobs:
    publish:
        name: Build and Publish Docker image
        strategy:
          fail-fast: false
          matrix:
            arch: ["arm64", "armv7", "armv6", "armv5", "x86_64", "x86_64_musl", "i386", "ppc64le"]
        runs-on: ubuntu-latest
        steps:
        - name: Free disk space
          run: |
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
            sudo docker image prune -af
            df -h /
        - name: Checkout
          uses: actions/checkout@v4
        - name: Authenticate Docker
          uses: docker/login-action@v3.0.0
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
        - name: Build
          run: |
            export SWIFT_BUILDROOT=$GITHUB_WORKSPACE
            export SWIFT_TARGET_ARCH=${{ matrix.arch }}
            $SWIFT_BUILDROOT/.devcontainer/build-scripts/build-docker.sh
        - name: Archive Build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: build-${{ matrix.arch }}
            path: ./output/${{ matrix.arch }}/images
