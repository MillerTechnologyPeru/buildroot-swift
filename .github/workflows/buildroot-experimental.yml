name: Buildroot experimental
# Architectures that build the Swift stdlib but are not yet proven enough to
# gate every push. Built entirely from source, the way buildroot-host.yml
# builds the proven architectures: no install-swift.sh step, so host-swift
# has nothing pre-installed to short-circuit its own from-source build, and
# actually compiles the patched llvm-project and swift sources in
# package/swift/swift-source-patches/ - which is what MIPS and 32-bit
# PowerPC need for clang to carry the Swift calling convention at all. The
# prebuilt toolchain install-swift.sh would otherwise download does not have
# that patch, and silently lets clang ignore swiftcall instead of failing.
#
# That is hours of compute, so this runs on the self-hosted "master" runner
# rather than ubuntu-latest, same as buildroot-host.yml.
on: [workflow_dispatch]
jobs:

    build:
        name: Build Swift for Buildroot (${{ matrix.config }})
        strategy:
          fail-fast: false
          matrix:
            config: ["riscv64", "ppc", "mipsel", "mips64el", "mips", "mips64"]
        runs-on: [self-hosted, master]
        container: colemancda/buildroot-swift
        timeout-minutes: 720
        steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Build
          run: |
            export SWIFT_BUILDROOT=$GITHUB_WORKSPACE
            export SWIFT_TARGET_ARCH=${{ matrix.config }}
            $SWIFT_BUILDROOT/.devcontainer/build-scripts/download-buildroot.sh
            $SWIFT_BUILDROOT/.devcontainer/build-scripts/build.sh
        - name: Archive Build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: build-${{ matrix.config }}
            path: ./output/${{ matrix.config }}/images
